name: openchallenge
services:
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build:
      context: .
      args:
        ORIGIN: ${ORIGIN:-http://localhost:3000}
    environment:
      DATABASE_URL: postgresql://portal:${POSTGRES_PASSWORD}@db:5432/portal
      WEB_DATABASE_PASSWORD: ${WEB_DATABASE_PASSWORD:?Set WEB_DATABASE_PASSWORD in .env}
      WORKER_DATABASE_PASSWORD: ${WORKER_DATABASE_PASSWORD:?Set WORKER_DATABASE_PASSWORD in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      DEMO_MODE: "false"
    command: ["sh", "-c", "npm run db:migrate && npm run db:provision && npm run db:encrypt-tokens"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  web:
    build:
      context: .
      args:
        ORIGIN: ${ORIGIN:-http://localhost:3000}
    environment:
      DATABASE_URL: postgresql://portal_web:${WEB_DATABASE_PASSWORD}@db:5432/portal
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      BETTER_AUTH_URL: ${ORIGIN:-http://localhost:3000}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
      OIDC_LOGIN_LABEL: ${OIDC_LOGIN_LABEL:-Organization sign-in}
      DEMO_MODE: ${DEMO_MODE:-false}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-demo@example.test}
      UPLOAD_DIR: /data/uploads
      BODY_SIZE_LIMIT: 12M
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/data/uploads
      - ./challenges:/app/challenges:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health', {headers: {'X-Forwarded-For': '127.0.0.1'}}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: unless-stopped
  worker:
    build:
      context: ./worker
    environment:
      DATABASE_URL: postgresql://portal_worker:${WORKER_DATABASE_PASSWORD}@db:5432/portal
      UPLOAD_DIR: /data/uploads
      GROUND_TRUTH_DIR: /data/reference
      POLL_SECONDS: ${POLL_SECONDS:-2}
      JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-120}
    volumes:
      - uploads:/data/uploads
      - ${GROUND_TRUTH_DIR:-./examples/example/private}:/data/reference:ro
      - ./challenges:/app/challenges:ro
    depends_on:
      web:
        condition: service_healthy
    cpus: 1
    mem_limit: 512m
    restart: unless-stopped
volumes:
  postgres-data:
  uploads:
