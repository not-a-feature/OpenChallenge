[project]
name = "openchallenge-worker"
version = "0.1.0"
description = "Archive validation and reproducible string comparison for OpenChallenge"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "rapidfuzz>=3.14.6,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
